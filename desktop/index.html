<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Desktop dashboard for the XV Riigikogu — the session hall seating plan, the member directory and a coalition calculator.">
  <title>XV Riigikogu Desktop</title>

  <!--
    Its own manifest, and deliberately a second one rather than a shared one:
    `scope` here is `/riigikogu-mobile/desktop/`, nested inside the mobile app's
    `/riigikogu-mobile/`, so the two install as two apps with two start URLs.
    The service worker is shared — see the note below (USABILITY.md §10.11).
  -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="../icons/desktop-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icons/desktop-apple-touch-icon.png">
  <link rel="stylesheet" href="../desktop.css">
</head>
<body>
  <!--
    The desktop surface's shell, and nothing else — the same rule the mobile
    `index.html` follows: no data, no view markup, no inline styles. Everything
    visible is rendered by src/views-desktop/ into #app.

    It is a second VIEW over the unchanged DATA and LOGIC layers: `src/data.js`
    and `src/lib/*` are shared with the mobile app and are not touched by this
    surface (USABILITY.md §10.5). `data/seating.json` is the one dataset only
    this surface reads.

    The service worker is the repository root's `service-worker.js`, registered
    by src/views-desktop/app.js — one worker for both surfaces, because its
    scope (`/riigikogu-mobile/`) already contains this directory and a second
    worker nested inside it would only split the cache in two. The precache list
    covers this shell, `desktop.css`, every `src/views-desktop/` module and
    `data/seating.json` (USABILITY.md §10.11).
  -->
  <div id="app" role="application" aria-label="XV Riigikogu Desktop Dashboard">
    <p class="boot">Loading the Riigikogu…</p>
  </div>

  <noscript>
    <p class="boot">This dashboard needs JavaScript to read <code>data/*.json</code>.</p>
  </noscript>

  <script type="module" src="../src/views-desktop/app.js"></script>
</body>
</html>
