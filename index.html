<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Riigikogu XV Dashboard</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Theme Color -->
  <meta name="theme-color" content="#0072CE">
  <meta name="msapplication-TileColor" content="#0072CE">

  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Riigikogu">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- iOS Icons -->
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-192x192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-192x192.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/icon-192x192.png">

  <!-- iOS Splash Screens (optional - can add later) -->
  <meta name="apple-mobile-web-app-orientations" content="portrait-primary">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-192x192.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-192x192.png">

  <!-- Microsoft Tile -->
  <meta name="msapplication-TileImage" content="icons/icon-192x192.png">

  <!-- Description -->
  <meta name="description" content="Dashboard for tracking Riigikogu XV parliamentary activities">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #ffffff;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    .container {
      text-align: center;
      max-width: 600px;
    }

    .logo {
      width: 120px;
      height: 120px;
      background-color: #0072CE;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 30px;
      box-shadow: 0 4px 20px rgba(0, 114, 206, 0.3);
    }

    .logo-text {
      font-size: 64px;
      font-weight: bold;
      color: white;
    }

    h1 {
      font-size: 28px;
      color: #0072CE;
      margin-bottom: 10px;
    }

    p {
      font-size: 16px;
      color: #666;
      line-height: 1.6;
    }

    .status {
      margin-top: 30px;
      padding: 15px 25px;
      background-color: #f0f7ff;
      border-radius: 8px;
      color: #0072CE;
      font-size: 14px;
    }

    .install-prompt {
      margin-top: 20px;
      padding: 15px;
      background-color: #fff3cd;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }

    .install-prompt.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <span class="logo-text">R</span>
    </div>
    <h1>Riigikogu XV Dashboard</h1>
    <p>Dashboard for tracking Estonian Parliament (Riigikogu XV) activities and voting records.</p>
    <div class="status" id="status">
      Loading...
    </div>
    <div class="install-prompt" id="installPrompt">
      Add this app to your home screen for the best experience.
    </div>
  </div>

  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const registration = await navigator.serviceWorker.register('/riigikogu-dashboard/service-worker.js');
          console.log('Service Worker registered:', registration.scope);
          document.getElementById('status').textContent = 'App ready for offline use';
        } catch (error) {
          console.error('Service Worker registration failed:', error);
          document.getElementById('status').textContent = 'Online mode only';
        }
      });
    } else {
      document.getElementById('status').textContent = 'PWA not supported in this browser';
    }

    // PWA Install Prompt
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installPrompt').classList.add('show');
    });

    // Detect iOS
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

    if (isIOS && !isStandalone) {
      document.getElementById('installPrompt').textContent =
        'Install this app: tap the Share button and then "Add to Home Screen"';
      document.getElementById('installPrompt').classList.add('show');
    }
  </script>
</body>
</html>
