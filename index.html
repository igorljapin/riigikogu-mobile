<style>
/* === SUBTLE ENHANCEMENTS ONLY - No visual changes === */

/* 1. TOUCH FEEDBACK */
button {
  transition: transform 150ms ease-out, box-shadow 150ms ease-out !important;
}
button:active {
  transform: scale(0.98) !important;
}

/* Party cards and interactive cards */
.bg-white[class*="rounded"], 
.bg-slate-50[class*="rounded"],
[class*="bg-"][class*="rounded-2xl"] {
  transition: transform 150ms ease-out, box-shadow 150ms ease-out !important;
}
.bg-white[class*="rounded"]:active,
[class*="bg-"][class*="rounded-2xl"]:active {
  transform: scale(0.98) !important;
}

/* 2. SMOOTH TRANSITIONS */
/* Tab content transitions */
main > div {
  animation: fadeIn 200ms ease-out;
}
@keyframes fadeIn {
  from { opacity: 0.7; }
  to { opacity: 1; }
}

/* Number transitions */
.text-4xl, .text-2xl, .text-lg {
  transition: all 300ms ease-out !important;
}

/* 3. FOCUS STATES */
input[type="text"], input[type="search"], input:not([type]) {
  transition: box-shadow 200ms ease-out, border-color 200ms ease-out !important;
}
input:focus {
  box-shadow: 0 0 0 3px rgba(147, 51, 234, 0.15) !important;
  outline: none !important;
}

/* 4. SUBTLE DEPTH - Very minimal shadows */
.bg-white {
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04) !important;
}

/* 5. HOVER POLISH - Desktop only */
@media (hover: hover) {
  /* Board member circles */
  button[class*="rounded-full"][class*="w-12"] {
    transition: transform 200ms cubic-bezier(0.34, 1.56, 0.64, 1) !important;
  }
  button[class*="rounded-full"][class*="w-12"]:hover {
    transform: scale(1.08) !important;
    z-index: 10;
  }
  
  /* Bottom nav icons */
  nav button svg {
    transition: transform 200ms ease-out !important;
  }
  nav button:hover svg {
    transform: scale(1.1) !important;
  }
  
  /* Party selection cards */
  [class*="border-2"][class*="rounded-2xl"]:hover {
    filter: brightness(0.98);
  }
}

/* 6. ANIMATION REFINEMENTS */
/* Majority threshold marker pulse */
.bg-purple-600[class*="absolute"] {
  animation: subtlePulse 2s ease-in-out infinite;
}
@keyframes subtlePulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.85; }
}

/* Selection spring effect */
[class*="border-purple-600"], [class*="border-2"]:not([class*="border-slate"]) {
  transition: transform 200ms cubic-bezier(0.34, 1.56, 0.64, 1), 
              border-color 150ms ease-out !important;
}

/* 7. PERFORMANCE */
button, nav, [class*="rounded-full"] {
  will-change: transform;
}

/* Smooth scrolling */
.overflow-y-auto, .overflow-auto {
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}

/* Checkbox animation */
input[type="checkbox"] {
  transition: transform 150ms cubic-bezier(0.34, 1.56, 0.64, 1) !important;
}
input[type="checkbox"]:active {
  transform: scale(0.9) !important;
}

/* Modal backdrop */
.fixed.inset-0.bg-black\/50 {
  animation: fadeInBackdrop 200ms ease-out;
}
@keyframes fadeInBackdrop {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* Modal content slide up */
.fixed.inset-0 > .absolute.bottom-0 {
  animation: slideUp 250ms cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes slideUp {
  from { transform: translateY(20px); opacity: 0.8; }
  to { transform: translateY(0); opacity: 1; }
}

/* Reduced motion support */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
