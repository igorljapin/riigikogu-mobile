<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Mobile dashboard for the XV Riigikogu — composition, members and a vote calculator.">
  <title>XV Riigikogu Dashboard</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <!--
    The whole app is rendered by src/app.js into #app. This file is a shell and
    nothing else: no data, no markup for a view, no inline styles. That is the
    point of the Phase-4 architecture — data lives in data/*.json, arithmetic in
    src/lib/, and everything visible in src/views/ + styles.css, so a redesign
    touches the last two and nothing else (ARCHITECTURE_PLAN.md §2).
  -->
  <div id="app" role="application" aria-label="XV Riigikogu Dashboard">
    <p class="boot">Loading the Riigikogu…</p>
  </div>

  <noscript>
    <p class="boot">This dashboard needs JavaScript to read <code>data/*.json</code>.</p>
  </noscript>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
