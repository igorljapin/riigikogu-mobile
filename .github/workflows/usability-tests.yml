name: Usability Contract

# The merge gate for every change to the app. A red run here means a feature
# listed in USABILITY.md regressed — see ARCHITECTURE_PLAN.md §3, "never merge
# a red suite", the single rule that prevents a repeat of commit 4dae72b.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR supersedes the run in flight.
concurrency:
  group: usability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    # NOTE: this job name is the branch-protection check name — it is the single
    # entry under "Require status checks to pass" in the ruleset on `main`.
    # Renaming it silently breaks that rule: every PR then sits waiting for a
    # check that never reports. If it ever changes again, edit the ruleset in
    # the same sitting, and edit it BEFORE merging the rename.
    #
    # Renamed Aug 2026: the job runs the unit suite, the Python resolver tests
    # and the whole Playwright suite — Tier 1, Tier 2 and PWA — so the old
    # "Playwright (Tier 1)" named about a third of what it gates.
    name: Usability Contract (full suite)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs first: pure calculator/faction maths, no browser needed. Cheap and
      # fast, so a broken threshold fails the job in seconds rather than after a
      # full browser run — and the failure is unambiguous about which layer broke.
      - name: Unit tests (src/lib)
        run: npm run test:unit

      # The Python half of the same idea: the monthly job's resolvers, run
      # against the frozen API payload in tests/fixtures/. Offline and
      # deterministic — it is what stops the `factions[0]` bug coming back.
      - name: Resolver regression tests (scripts/)
        run: npm run test:resolvers

      # The runner has no pre-installed Chromium, so Playwright fetches the
      # build matching the pinned @playwright/test. Locally the config points at
      # the sandbox's /opt/pw-browsers/chromium instead — see playwright.config.js.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The app is static with no build step; the config starts
      # `python3 -m http.server` itself and waits for it.
      - name: Run the Usability Contract suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14
