<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:220},&quot;mark&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;a&quot;,&quot;b&quot;,&quot;c&quot;],&quot;default&quot;:&quot;a&quot;,&quot;tsType&quot;:&quot;'a'|'b'|'c'&quot;},&quot;surface&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;mobile&quot;,&quot;desktop&quot;],&quot;default&quot;:&quot;mobile&quot;,&quot;tsType&quot;:&quot;'mobile'|'desktop'&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;,&quot;tinted&quot;,&quot;clear&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light'|'dark'|'tinted'|'clear'&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;options&quot;:[&quot;#9333ea&quot;,&quot;#2563eb&quot;,&quot;#e11d48&quot;,&quot;#0f172a&quot;],&quot;default&quot;:&quot;#9333ea&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const PAL = {
  a: {
    light:  { c1:'#0f172a', c2:'#f4f6f8', c3:'#94a3b8', c4:'#9333ea', c5:'#2563eb', c6:'#233046', c7:'#f4f6f8', c8:'#0f172a' },
    dark:   { c1:'#080d16', c2:'#f6f8fb', c3:'#64748b', c4:'#9333ea', c5:'#2563eb', c6:'#233046', c7:'#f6f8fb', c8:'#080d16' },
    tinted: { c1:'#16181d', c2:'#e6e8ec', c3:'#82868d', c4:'#82868d', c5:'#b9bdc4', c6:'#23262b', c7:'#e6e8ec', c8:'#16181d' },
    clear:  { c1:'none', c2:'rgba(255,255,255,.94)', c3:'rgba(255,255,255,.5)', c4:'rgba(255,255,255,.5)', c5:'rgba(255,255,255,.8)', c6:'rgba(255,255,255,.26)', c7:'rgba(255,255,255,.94)', c8:'rgba(70,90,120,.5)' }
  },
  b: {
    light:  { c1:'#0f172a', c2:'#f4f6f8', c3:'#0f172a', c4:'#9333ea', c5:'#2563eb', c6:'#0f172a', c7:'#f4f6f8', c8:'#0f172a' },
    dark:   { c1:'#080d16', c2:'#f6f8fb', c3:'#080d16', c4:'#9333ea', c5:'#2563eb', c6:'#080d16', c7:'#f6f8fb', c8:'#080d16' },
    tinted: { c1:'#16181d', c2:'#e6e8ec', c3:'#16181d', c4:'#82868d', c5:'#b9bdc4', c6:'#16181d', c7:'#e6e8ec', c8:'#16181d' },
    clear:  { c1:'none', c2:'rgba(255,255,255,.9)', c3:'rgba(28,38,58,.5)', c4:'rgba(255,255,255,.45)', c5:'rgba(28,38,58,.4)', c6:'rgba(28,38,58,.55)', c7:'rgba(255,255,255,.7)', c8:'rgba(28,38,58,.5)' }
  },
  c: {
    light:  { c1:'#f4f6f8', c2:'#0f172a', c3:'#94a3b8', c4:'#9333ea', c5:'#2563eb', c6:'#0f172a', c7:'#f4f6f8', c8:'#0f172a' },
    dark:   { c1:'#131b29', c2:'#f6f8fb', c3:'#64748b', c4:'#9333ea', c5:'#2563eb', c6:'#131b29', c7:'#f6f8fb', c8:'#131b29' },
    tinted: { c1:'#16181d', c2:'#e6e8ec', c3:'#82868d', c4:'#82868d', c5:'#b9bdc4', c6:'#16181d', c7:'#e6e8ec', c8:'#16181d' },
    clear:  { c1:'none', c2:'rgba(255,255,255,.9)', c3:'rgba(255,255,255,.5)', c4:'rgba(255,255,255,.5)', c5:'rgba(255,255,255,.75)', c6:'rgba(28,38,58,.3)', c7:'rgba(255,255,255,.9)', c8:'rgba(28,38,58,.4)' }
  }
};

class Component extends DCLogic {
  renderVals() {
    const mark = this.props.mark || 'a';
    const surface = this.props.surface || 'mobile';
    const mode = this.props.mode || 'light';
    const p = { ...(PAL[mark] || PAL.a)[mode] };
    const accent = this.props.accent;
    if (accent && mode === 'light') p.c4 = accent;
    return {
      ...p,
      showAM: mark === 'a' && surface === 'mobile',
      showAD: mark === 'a' && surface === 'desktop',
      showBM: mark === 'b' && surface === 'mobile',
      showBD: mark === 'b' && surface === 'desktop',
      showCM: mark === 'c' && surface === 'mobile',
      showCD: mark === 'c' && surface === 'desktop'
    };
  }
}
</script>
