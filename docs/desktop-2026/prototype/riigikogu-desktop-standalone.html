document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ine-height:1.2;letter-spacing:-0.01em\">{{ c.label }}<\u002Fspan><\u002Fbutton>\n                  <span style=\"{{ c.markStyle }}\"><\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"{{ tipStyle }}\">\n              <span style=\"display:block;font-weight:600;font-size:14px;line-height:1.2;color:#fff\">{{ tipName }}<\u002Fspan>\n              <span style=\"display:block;margin-top:4px;font-weight:500;font-size:12px;line-height:1.25;color:rgba(255,255,255,.72)\">{{ tipSub }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;align-items:center;gap:26px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)\">\n            <span style=\"display:flex;align-items:center;gap:8px;font-weight:500;font-size:13px;line-height:1;color:var(--muted)\"><span style=\"width:14px;height:14px;border-radius:4px;background:var(--track);box-shadow:0 0 0 2px var(--text)\"><\u002Fspan>in the count<\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:8px;font-weight:500;font-size:13px;line-height:1;color:var(--muted)\"><span style=\"width:14px;height:14px;border-radius:4px;background:var(--track);opacity:.35\"><\u002Fspan>not counted<\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:8px;font-weight:500;font-size:13px;line-height:1;color:var(--muted)\"><span style=\"width:14px;height:14px;border-radius:4px;background:var(--remBg);box-shadow:0 0 0 2px var(--remFg)\"><\u002Fspan>held out of a selected party<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:14px;overflow-y:auto\">\n          <div style=\"padding:20px 20px 18px;border-radius:22px;background:var(--hero);color:#fff\">\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px\">\n              <span style=\"font-weight:700;font-size:56px;line-height:.9;letter-spacing:-0.04em\">{{ selSeats }}<\u002Fspan>\n              <span style=\"text-align:right;font-weight:600;font-size:16px;line-height:1.3;color:{{ verdictColor }}\">{{ verdict }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"position:relative;height:44px;margin-top:20px\">\n              <div style=\"position:absolute;left:0;right:0;top:14px;height:14px;border-radius:999px;background:rgba(255,255,255,.14)\"><\u002Fdiv>\n              <div style=\"position:absolute;left:0;top:14px;height:14px;border-radius:999px;width:{{ selPct }};background:{{ fillColor }}\"><\u002Fdiv>\n              <sc-for list=\"{{ marks }}\" as=\"k\" hint-placeholder-count=\"4\">\n                <span style=\"position:absolute;top:0;left:{{ k.left }};transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px\">\n                  <span style=\"width:2px;height:28px;background:{{ k.tick }}\"><\u002Fspan>\n                  <span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:600;font-size:11px;line-height:1;color:{{ k.color }}\">{{ k.need }}<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px\">\n              <sc-for list=\"{{ marks }}\" as=\"k\" hint-placeholder-count=\"4\">\n                <span style=\"display:flex;flex-direction:column;gap:5px;padding:10px 11px;border:1px solid {{ k.chipBorder }};border-radius:12px;background:{{ k.chipBg }}\">\n                  <span style=\"font-weight:700;font-size:15px;line-height:1;color:{{ k.chipFg }}\">{{ k.fraction }}<\u002Fspan>\n                  <span style=\"font-weight:500;font-size:11px;line-height:1.25;color:rgba(255,255,255,.66)\">{{ k.chipNote }}<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <p style=\"margin:14px 0 0;font-weight:500;font-size:15px;line-height:1.4;color:rgba(255,255,255,.72)\">{{ hint }}<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;gap:8px\">\n            <sc-for list=\"{{ presets }}\" as=\"p\" hint-placeholder-count=\"3\">\n              <button type=\"button\" sc-camel-on-click=\"{{ p.run }}\" style=\"flex:1;height:46px;border:1px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;font-family:inherit;font-weight:600;font-size:15px;line-height:1;color:{{ p.color }}\">{{ p.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div>\n            <h2 style=\"margin:4px 0 10px;font-weight:600;font-size:13px;line-height:1;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)\">Tap a party in or out<\u002Fh2>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n              <sc-for list=\"{{ calcParties }}\" as=\"p\" hint-placeholder-count=\"7\">\n                <button type=\"button\" sc-camel-on-click=\"{{ p.toggle }}\" style=\"display:flex;flex-direction:column;gap:6px;min-height:80px;padding:13px;border:2px solid {{ p.border }};border-radius:18px;background:{{ p.bg }};cursor:pointer;text-align:left\">\n                  <span style=\"display:flex;align-items:center;gap:8px\">\n                    <span style=\"width:12px;height:12px;border-radius:4px;background:{{ p.color }}\"><\u002Fspan>\n                    <span style=\"font-weight:600;font-size:15px;line-height:1.2;color:var(--text)\">{{ p.short }}<\u002Fspan>\n                  <\u002Fspan>\n                  <span style=\"display:flex;align-items:baseline;gap:6px\">\n                    <span style=\"font-weight:700;font-size:28px;line-height:1;letter-spacing:-0.03em;color:{{ p.countColor }}\">{{ p.count }}<\u002Fspan>\n                    <span style=\"font-weight:500;font-size:13px;line-height:1.2;color:var(--muted)\">of {{ p.total }}<\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div>\n            <h2 style=\"margin:4px 0 10px;font-weight:600;font-size:13px;line-height:1;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)\">Named adjustments<\u002Fh2>\n            <p style=\"display:{{ noAdjDisplay }};margin:0;padding:14px 16px;border:1px dashed var(--line);border-radius:14px;font-weight:400;font-size:14px;line-height:1.4;color:var(--muted)\">Click a seat on the floor plan to add a member from a non-selected party, or hold a selected party's member out of the count.<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <sc-for list=\"{{ adjustments }}\" as=\"a\" hint-placeholder-count=\"1\">\n                <span style=\"display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card)\">\n                  <span style=\"display:flex;flex:0 0 30px;width:30px;height:30px;align-items:center;justify-content:center;border-radius:9px;font-weight:700;font-size:13px;line-height:1;background:{{ a.badgeBg }};color:{{ a.badgeFg }}\">{{ a.badge }}<\u002Fspan>\n                  <span style=\"flex:1;min-width:0\">\n                    <span style=\"display:block;font-weight:600;font-size:15px;line-height:1.25;color:var(--text)\">{{ a.name }}<\u002Fspan>\n                    <span style=\"display:block;font-weight:400;font-size:13px;line-height:1.3;color:var(--muted)\">{{ a.note }}<\u002Fspan>\n                  <\u002Fspan>\n                  <button type=\"button\" sc-camel-on-click=\"{{ a.undo }}\" style=\"height:40px;padding:0 14px;border:1px solid var(--line);border-radius:11px;background:transparent;cursor:pointer;font-family:inherit;font-weight:600;font-size:14px;line-height:1;color:var(--muted)\">Undo<\u002Fbutton>\n                <\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080},&quot;view&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;parliament&quot;,&quot;directory&quot;,&quot;calculator&quot;],&quot;default&quot;:&quot;parliament&quot;,&quot;tsType&quot;:&quot;'parliament' | 'directory' | 'calculator'&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light' | 'dark'&quot;},&quot;showSeatNames&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Seating plan&quot;},&quot;showDefectorMarks&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Seating plan&quot;}}\">\nconst NAV = [\n  { id: 'parliament', label: 'Parliament', d: 'M3 20h18M4 20a8 8 0 0 1 16 0M8 20v-3.4M12 20v-4.6M16 20v-3.4' },\n  { id: 'directory', label: 'Directory', d: 'M9.5 5.5a3 3 0 1 1 0 6 3 3 0 0 1 0-6M3.5 19.5a6 6 0 0 1 12 0M15.5 6.2a2.6 2.6 0 0 1 0 5.2M17 19.5a5 5 0 0 0-2.4-4.3' },\n  { id: 'calculator', label: 'Calculator', d: 'M5 2.5h14v19H5zM8.5 6.5h7M9 12h.01M12 12h.01M15 12h.01M9 16.5h.01M12 16.5h.01M15 16.5h.01' }\n];\nconst NOOP = () => {};\nconst CLEAR_BTN = 'flex:0 0 auto;height:28px;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:transparent;font-family:inherit;font-weight:600;font-size:12px;line-height:1;color:var(--muted);';\nconst photoStyle = url => 'position:absolute;inset:0;background-size:cover;background-position:center top' + (url ? ';background-image:url(' + url + ')' : '');\nconst MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\nconst FRACTIONS = [\n  { need: 51, fraction: '1/2+1', note: 'Ordinary legislation' },\n  { need: 61, fraction: '3/5', note: 'Constitution, 2nd route' },\n  { need: 68, fraction: '2/3', note: 'Constitutional amendment' },\n  { need: 81, fraction: '4/5', note: 'Urgent amendment' }\n];\n\nclass Component extends DCLogic {\n  state = {\n    data: null, view: null, hover: null, popup: null,\n    query: '', filter: 'all', selected: '563f86fd-db45-4046-b8ed-b66e5a2aec45', highlight: [],\n    sel: { parties: ['reform', 'e200'], added: ['987e47c7-929b-4437-9385-fab4f4fd7824'], excluded: [] }\n  };\n\n  componentDidMount() {\n    if (this.props.data) return;\n    const blob = document.getElementById('rk-data');\n    if (blob) { try { this.setState({ data: JSON.parse(blob.textContent) }); return; } catch (e) { console.warn('inline data unreadable, fetching', e); } }\n    const files = ['parties', 'mps', 'alignment', 'board', 'meta', 'seating'];\n    Promise.all(files.map(f => fetch('./data/' + f + '.json').then(r => r.json())))\n      .then(([parties, mps, alignment, board, meta, seating]) =>\n        this.setState({ data: { parties, mps, alignment, board, meta, seating } }))\n      .catch(e => console.error('data load failed', e));\n  }\n\n  view() { return this.state.view || this.props.view || 'parliament'; }\n  set(k, v) { this.setState({ [k]: v }); }\n\n  toggleHighlight(id) {\n    this.setState(st => ({\n      highlight: st.highlight.includes(id) ? st.highlight.filter(x => x !== id) : st.highlight.concat(id),\n      popup: null\n    }));\n  }\n\n  model() {\n    const d = this.props.data || this.state.data;\n    if (!d) return null;\n    const roster = d.mps.filter(m => m.active !== false);\n    const party = {}; d.parties.forEach(p => { party[p.id] = p; });\n    const defectors = d.alignment.defectors || {};\n    const unaligned = new Set(d.alignment.unaligned || []);\n    const blocOf = id => d.alignment.blocs[id] || null;\n    const vb = m => (defectors[m.uuid] ? defectors[m.uuid].votesWith : m.registeredPartyId);\n    const byUuid = new Map(roster.map(m => [m.uuid, m]));\n    const counts = {};\n    roster.forEach(m => { const p = vb(m); counts[p] = (counts[p] || 0) + 1; });\n    const blocSeats = { coalition: 0, opposition: 0, unaligned: 0 };\n    roster.forEach(m => {\n      const b = unaligned.has(m.uuid) ? 'unaligned' : (blocOf(vb(m)) || 'unaligned');\n      blocSeats[b] += 1;\n    });\n    return { d, roster, party, defectors, unaligned, blocOf, vb, byUuid, counts, blocSeats };\n  }\n\n  initials(name) {\n    const parts = String(name || '').trim().split(/\\s+/);\n    const a = parts[0] || '', b = parts.length > 1 ? parts[parts.length - 1] : '';\n    return ((a[0] || '') + (b[0] || '')).toUpperCase();\n  }\n  blocLabel(b) { return b === 'coalition' ? 'Coalition' : b === 'opposition' ? 'Opposition' : 'Unaligned'; }\n  blocTint(b) { return b === 'coalition' ? 'var(--coalition)' : b === 'opposition' ? 'var(--opposition)' : 'var(--unalignedText)'; }\n  shortOf(m, id) { const p = m.party[id]; return !p ? '—' : (id === 'independent' ? 'Unaligned' : p.short); }\n  monthYear(iso) { if (!iso) return ''; const dt = new Date(iso); return MONTHS[dt.getUTCMonth()] + ' ' + dt.getUTCFullYear(); }\n  factionShort(m, factionName) {\n    const hit = m.d.parties.find(p => p.factionName === factionName);\n    return hit ? hit.short : String(factionName || '').replace(' Parliamentary Group', '');\n  }\n  subLine(mp) {\n    if (mp.boardRole) return mp.boardRole.replace(' of the Riigikogu', '');\n    if (mp.factionRole) return mp.factionRole;\n    if (mp.committees && mp.committees.length) return mp.committees[0].name;\n    return mp.district || '';\n  }\n\n  selSet(m) {\n    const { roster, vb } = m, s = this.state.sel;\n    const out = new Set();\n    roster.forEach(mp => {\n      const inParty = s.parties.includes(vb(mp));\n      if (inParty && !s.excluded.includes(mp.uuid)) out.add(mp.uuid);\n      if (!inParty && s.added.includes(mp.uuid)) out.add(mp.uuid);\n    });\n    return out;\n  }\n\n  toggleSeat(m, uuid) {\n    const mp = m.byUuid.get(uuid); if (!mp) return;\n    const s = this.state.sel, p = m.vb(mp), inParty = s.parties.includes(p);\n    const next = { parties: s.parties.slice(), added: s.added.slice(), excluded: s.excluded.slice() };\n    if (inParty) {\n      next.excluded = s.excluded.includes(uuid) ? s.excluded.filter(u => u !== uuid) : s.excluded.concat(uuid);\n    } else {\n      next.added = s.added.includes(uuid) ? s.added.filter(u => u !== uuid) : s.added.concat(uuid);\n    }\n    this.setState({ sel: next });\n  }\n\n  togglePartyCalc(m, id) {\n    const s = this.state.sel, on = s.parties.includes(id);\n    const ids = new Set(m.roster.filter(mp => m.vb(mp) === id).map(mp => mp.uuid));\n    this.setState({ sel: {\n      parties: on ? s.parties.filter(p => p !== id) : s.parties.concat(id),\n      added: on ? s.added : s.added.filter(u => !ids.has(u)),\n      excluded: on ? s.excluded.filter(u => !ids.has(u)) : s.excluded\n    } });\n  }\n\n  renderVals() {\n    const view = this.view();\n    const theme = (this.state.themeOverride || this.props.theme) === 'dark' ? 'dark' : 'light';\n    const showNames = this.props.showSeatNames !== false;\n    const showMarks = this.props.showDefectorMarks !== false;\n    const base = {\n      theme, themeLabel: theme === 'dark' ? 'DARK' : 'LIGHT',\n      toggleTheme: () => this.setState(st => ({ themeOverride: (st.themeOverride || this.props.theme || 'light') === 'dark' ? 'light' : 'dark' })),\n      isParliament: view === 'parliament', isDirectory: view === 'directory', isCalculator: view === 'calculator',\n      showHeaderBar: view === 'parliament',\n      viewTitle: view === 'directory' ? 'Members of the Riigikogu' : view === 'calculator' ? 'Coalition calculator' : 'Parliament',\n      viewSub: view === 'directory' ? 'All 101 members — search, filter by voting bloc, read a profile'\n        : view === 'calculator' ? 'Build a voting group and see which constitutional thresholds it clears'\n        : 'Seating plan, voting-bloc composition and the Board',\n      navItems: NAV.map(n => ({ ...n, go: () => this.setState({ view: n.id, popup: null }),\n        bg: n.id === view ? 'var(--track)' : 'transparent', color: n.id === view ? 'var(--accent)' : 'var(--muted)' })),\n      updatedLabel: 'Updated —', coalitionSeats: 0, oppositionSeats: 0, unalignedSeats: 0,\n      thresholdPct: '50.5%', blocBars: [], partyRows: [], boardRows: [], seatCells: [],\n      legendParties: [], floorCaption: '', popupDisplay: 'none', popup: {},\n      clearHighlight: () => this.set('highlight', []), clearStyle: CLEAR_BTN + 'visibility:hidden;pointer-events:none', clearLabel: 'Clear',\n      tipStyle: 'display:none', tipName: '', tipSub: '',\n      closePopup: () => this.set('popup', null),\n      openInDirectory: () => this.setState(st => (st.popup\n        ? { view: 'directory', selected: st.popup, popup: null, query: '', filter: 'all', highlight: [] }\n        : null)),\n      query: this.state.query, onQuery: e => this.setState({ query: e.target.value }),\n      countLabel: '', emptyDisplay: 'none', emptyLabel: '', blocFilters: [], tagFilters: [],\n      memberRows: [], profile: {}, profileFacts: [], profileSeatCells: [],\n      selSeats: 0, selPct: '0%', verdict: '', verdictColor: '#fff', fillColor: 'var(--accent)',\n      marks: [], presets: [], calcParties: [], adjustments: [], noAdjDisplay: 'none', hint: ''\n    };\n    const m = this.model();\n    if (!m) return base;\n\n    const meta = m.d.meta, total = meta.totalSeats;\n    const pct = n => (n / total * 100).toFixed(3) + '%';\n    base.updatedLabel = 'Updated ' + (() => { const dt = new Date(meta.sourceDate); return dt.getUTCDate() + ' ' + MONTHS[dt.getUTCMonth()].toUpperCase() + ' ' + dt.getUTCFullYear(); })();\n    base.coalitionSeats = m.blocSeats.coalition;\n    base.oppositionSeats = m.blocSeats.opposition;\n    base.unalignedSeats = m.blocSeats.unaligned;\n    base.thresholdPct = pct(meta.simpleMajority);\n    base.blocBars = [\n      { label: 'Coalition ' + m.blocSeats.coalition, color: 'var(--coalition)', width: pct(m.blocSeats.coalition) },\n      { label: 'Unaligned ' + m.blocSeats.unaligned, color: 'var(--unaligned)', width: pct(m.blocSeats.unaligned) },\n      { label: 'Opposition ' + m.blocSeats.opposition, color: 'var(--opposition)', width: pct(m.blocSeats.opposition) }\n    ];\n\n    const partyIds = Object.keys(m.counts).sort((a, b) => m.counts[b] - m.counts[a]);\n    const hlSet = this.state.highlight;\n    base.partyRows = partyIds.map(id => {\n      const p = m.party[id], isUn = id === 'independent', on = hlSet.includes(id);\n      return {\n        color: p.color, seats: m.counts[id], width: pct(m.counts[id]),\n        name: isUn ? 'Unaligned members' : p.short,\n        sub: isUn ? 'No group, no whip' : this.blocLabel(m.blocOf(id)) + ' · ' + p.nameEn,\n        toggle: () => this.toggleHighlight(id),\n        style: 'display:flex;flex-direction:column;gap:7px;width:100%;padding:9px 13px;border:1px solid '\n          + (on ? p.color : 'var(--line)') + ';border-radius:14px;cursor:pointer;text-align:left;font-family:inherit;background:'\n          + (on ? 'var(--track)' : 'transparent') + (on ? ';box-shadow:inset 0 0 0 1px ' + p.color : '')\n      };\n    });\n\n    const BLOC_ORDER = { coalition: 0, unaligned: 1, opposition: 2 };\n    base.legendParties = partyIds.slice().sort((a, b) => {\n      const ba = a === 'independent' ? 1 : BLOC_ORDER[m.blocOf(a)] ?? 1;\n      const bb = b === 'independent' ? 1 : BLOC_ORDER[m.blocOf(b)] ?? 1;\n      return ba - bb || m.counts[b] - m.counts[a];\n    }).map(id => {\n      const p = m.party[id], on = hlSet.includes(id), dim = hlSet.length && !on;\n      return {\n        short: id === 'independent' ? 'Unaligned' : p.short, seats: m.counts[id],\n        toggle: () => this.toggleHighlight(id),\n        style: 'display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:1px solid '\n          + (on ? p.color : 'var(--line)') + ';border-radius:10px;cursor:pointer;font-family:inherit;color:var(--text);background:'\n          + (on ? 'var(--track)' : 'transparent') + ';opacity:' + (dim ? '.45' : '1'),\n        swatch: 'width:11px;height:11px;border-radius:3px;flex:0 0 11px;background:' + p.color\n      };\n    });\n    base.floorCaption = hlSet.length\n      ? hlSet.map(id => (id === 'independent' ? 'Unaligned' : m.party[id].short)).join(' + ') + ' — '\n        + hlSet.reduce((n, id) => n + m.counts[id], 0) + ' of 101 seats highlighted'\n      : 'Click a party to highlight its members on the floor. Tiles are coloured by the party a member votes with.';\n    if (hlSet.length) base.clearStyle = CLEAR_BTN + 'cursor:pointer';\n\n    base.boardRows = m.d.board.map(b => ({\n      name: b.name, role: b.role, color: (m.party[b.partyId] || {}).color || '#808080',\n      open: () => this.setState({ view: 'directory', selected: b.uuid, query: '', filter: 'all' })\n    }));\n\n    // ── seating grid ──\n    const grid = m.d.seating, rows = grid.gridDimensions.rows, cols = grid.gridDimensions.cols;\n    const at = {};\n    Object.keys(grid.seats).forEach(u => { const s = grid.seats[u]; at[s.row + ':' + s.col] = u; });\n    const isCalc = view === 'calculator';\n    const inCount = isCalc ? this.selSet(m) : new Set();\n    const hl = isCalc ? [] : this.state.highlight;\n    const cells = [];\n    if (view !== 'directory') for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {\n      const uuid = at[r + ':' + c], mp = uuid ? m.byUuid.get(uuid) : null;\n      if (!mp) { cells.push({ style: 'display:none', markStyle: 'display:none', label: '', click: NOOP, enter: NOOP, leave: NOOP }); continue; }\n      const pid = m.vb(mp), p = m.party[pid] || { color: '#808080', textColor: '#fff' };\n      const parts = mp.name.split(' ');\n      const def = m.defectors[mp.uuid];\n      const un = m.unaligned.has(mp.uuid);\n      const bloc = un ? 'unaligned' : (m.blocOf(pid) || 'unaligned');\n      const lit = hl.length ? hl.includes(pid) : true;\n      const held = this.state.sel.excluded.includes(mp.uuid);\n      const counted = inCount.has(mp.uuid);\n      let ring = 'none', opacity = 1, bg = p.color;\n      if (isCalc) {\n        if (held) { ring = '0 0 0 2px var(--remFg)'; opacity = 1; }\n        else if (counted) { ring = '0 0 0 2px var(--text)'; }\n        else { opacity = .32; }\n      } else if (hl.length) {\n        if (lit) ring = '0 0 0 2px var(--text)'; else opacity = .32;\n      }\n      cells.push({\n        style: 'display:flex;align-items:center;justify-content:center;width:100%;height:100%;padding:3px 2px;border:0;border-radius:7px;cursor:pointer;text-align:center;background:' + bg + ';color:' + p.textColor + ';opacity:' + opacity + ';box-shadow:' + ring,\n        markStyle: showMarks && def\n          ? 'position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;background:' + ((m.party[mp.registeredPartyId] || {}).color || '#808080') + ';box-shadow:0 0 0 2px ' + bg\n          : 'display:none',\n        label: showNames ? parts[0] + '\\n' + parts.slice(1).join(' ') : '',\n        enter: () => this.set('hover', mp.uuid),\n        leave: () => this.setState(st => (st.hover === mp.uuid ? { hover: null } : null)),\n        click: isCalc ? () => this.toggleSeat(m, mp.uuid) : () => this.set('popup', mp.uuid)\n      });\n      if (this.state.hover === mp.uuid) {\n        base.tipName = mp.name;\n        base.tipSub = (def ? 'Votes with ' + this.shortOf(m, pid) + ' · registered ' + this.shortOf(m, mp.registeredPartyId) : this.shortOf(m, pid))\n          + ' · ' + this.blocLabel(bloc)\n          + (mp.factionRole ? ' · ' + mp.factionRole : mp.boardRole ? ' · ' + mp.boardRole.replace(' of the Riigikogu', '') : '');\n        base.tipStyle = 'position:absolute;left:' + ((c + 0.5) / cols * 100).toFixed(3) + '%;top:' + (r * 59 - 8) + 'px;transform:translate(-50%,-100%);z-index:30;padding:10px 13px;border-radius:12px;background:var(--hero);box-shadow:var(--pop);white-space:nowrap;pointer-events:none';\n      }\n    }\n    base.seatCells = cells;\n\n    if (this.state.popup && m.byUuid.get(this.state.popup)) {\n      const mp = m.byUuid.get(this.state.popup), pid = m.vb(mp), p = m.party[pid] || {};\n      const bloc = m.unaligned.has(mp.uuid) ? 'unaligned' : (m.blocOf(pid) || 'unaligned');\n      base.popupDisplay = 'block';\n      base.popup = {\n        name: mp.name, initials: this.initials(mp.name), photoStyle: photoStyle(mp.photoUrl),\n        color: p.color || '#808080', textColor: p.textColor || '#fff',\n        short: bloc === 'unaligned' ? 'Non-affiliated' : this.shortOf(m, pid), bloc: this.blocLabel(bloc), blocColor: this.blocTint(bloc),\n        role: mp.boardRole || mp.factionRole || (m.defectors[mp.uuid] ? 'Registered ' + this.shortOf(m, mp.registeredPartyId) + ' · votes with ' + this.shortOf(m, pid) : 'Member'),\n        committees: (mp.committees || []).map(c => c.name + (c.role && c.role !== 'member' ? ' (' + c.role + ')' : '')).join(' · ') || '—',\n        district: mp.district\n      };\n    }\n\n    // ── directory ──\n    if (view === 'directory') {\n    const q = this.state.query.trim().toLowerCase(), f = this.state.filter;\n    const passes = mp => {\n      if (f === 'coalition' || f === 'opposition') return !m.unaligned.has(mp.uuid) && m.blocOf(m.vb(mp)) === f;\n      if (f === 'unaligned') return m.unaligned.has(mp.uuid);\n      if (f === 'chairs') return !!(mp.factionRole || mp.boardRole);\n      if (f === 'usa') return mp.usaFriendship === true;\n      return true;\n    };\n    const list = m.roster.filter(mp => passes(mp) && (!q || mp.name.toLowerCase().includes(q)));\n    base.countLabel = list.length + (list.length === 1 ? ' member' : ' members');\n    base.emptyDisplay = list.length ? 'none' : 'block';\n    base.emptyLabel = 'No member matches “' + this.state.query + '”.';\n    base.blocFilters = [['all', 'All'], ['coalition', 'Coalition'], ['opposition', 'Opposition'], ['unaligned', 'Unaligned']].map(([id, label]) => ({\n      label, pick: () => this.set('filter', id),\n      bg: f === id ? 'var(--card)' : 'transparent', color: f === id ? 'var(--text)' : 'var(--muted)',\n      shadow: f === id ? 'var(--shadow)' : 'none'\n    }));\n    base.tagFilters = [['chairs', 'Chairs & officers'], ['usa', 'USA friendship group']].map(([id, label]) => ({\n      label, pick: () => this.set('filter', f === id ? 'all' : id),\n      bg: f === id ? 'var(--hero)' : 'var(--card)', color: f === id ? '#fff' : 'var(--text)',\n      border: f === id ? 'var(--hero)' : 'var(--line)'\n    }));\n    base.memberRows = list.map(mp => {\n      const pid = m.vb(mp), p = m.party[pid] || {};\n      const on = this.state.selected === mp.uuid;\n      const col = p.color || '#808080', fgc = p.textColor || '#fff';\n      return {\n        name: mp.name, sub: this.subLine(mp), initials: this.initials(mp.name), badge: this.shortOf(m, pid),\n        style: 'display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:10px 20px;border:0;border-top:1px solid var(--line);border-left:3px solid ' + (on ? 'var(--accent)' : 'transparent') + ';cursor:pointer;text-align:left;background:' + (on ? 'var(--track)' : 'transparent'),\n        avatar: 'display:flex;flex:0 0 44px;width:44px;height:44px;align-items:center;justify-content:center;border-radius:50%;font-weight:700;font-size:15px;line-height:1;background:' + col + ';color:' + fgc,\n        badgeStyle: 'padding:5px 10px;border-radius:8px;font-weight:700;font-size:12px;line-height:1.2;background:' + col + ';color:' + fgc,\n        pick: () => this.set('selected', mp.uuid)\n      };\n    });\n\n    const sel = m.byUuid.get(this.state.selected) || m.roster[0];\n    if (sel) {\n      const pid = m.vb(sel), p = m.party[pid] || {};\n      const un = m.unaligned.has(sel.uuid), bloc = un ? 'unaligned' : (m.blocOf(pid) || 'unaligned');\n      const def = m.defectors[sel.uuid];\n      let warn = '';\n      if (def) warn = def.note + ' — registered non-affiliated, counted with ' + this.shortOf(m, pid) + ' in bloc arithmetic.';\n      else if (un && sel.leftFaction) warn = 'Left ' + this.factionShort(m, sel.leftFaction) + ' in ' + this.monthYear(sel.leftFactionDate) + ' — no group, no whip. Counted in neither bloc.';\n      base.profile = {\n        name: sel.name, initials: this.initials(sel.name), photoStyle: photoStyle(sel.photoUrl), url: sel.profileUrl,\n        color: p.color || '#808080', textColor: p.textColor || '#fff',\n        short: bloc === 'unaligned' ? 'Non-affiliated' : this.shortOf(m, pid), bloc: this.blocLabel(bloc), blocColor: this.blocTint(bloc),\n        usaDisplay: sel.usaFriendship ? 'inline-flex' : 'none',\n        warn, warnDisplay: warn ? 'block' : 'none'\n      };\n      const facts = [];\n      const office = sel.boardRole || sel.factionRole;\n      if (office) facts.push({ label: 'Office', value: office, span: '1 / -1' });\n      facts.push({ label: 'District', value: sel.district || '—', span: 'auto' });\n      facts.push({ label: 'Registered', value: (m.party[sel.registeredPartyId] || {}).nameEn || '—', span: 'auto' });\n      facts.push({ label: 'Committees', value: (sel.committees || []).map(c => c.name + (c.role && c.role !== 'member' ? ' (' + c.role + ')' : '')).join(' · ') || '—', span: '1 / -1' });\n      facts.push({ label: 'Votes with', value: pid === sel.registeredPartyId ? 'Own group' : this.shortOf(m, pid) + ' (defected)', span: 'auto' });\n      facts.push({ label: 'Email', value: sel.email || '—', span: 'auto' });\n      base.profileFacts = facts;\n\n      const mySeat = grid.seats[sel.uuid];\n      base.profile.seatLabel = mySeat ? 'Row ' + (mySeat.row + 1) + ', column ' + (mySeat.col + 1) + ' of the 10 × 12 floor grid' : 'No seat recorded';\n      const mini = [];\n      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {\n        const u = at[r + ':' + c];\n        const isMe = u === sel.uuid;\n        mini.push({ style: 'height:8px;border-radius:2px;background:' + (!u ? 'transparent' : isMe ? (p.color || '#808080') : 'var(--track)') + (isMe ? ';box-shadow:0 0 0 2px var(--text)' : '') });\n      }\n      base.profileSeatCells = mini;\n    }\n    }\n\n    // ── calculator ──\n    if (view === 'calculator') {\n    const seats = inCount.size;\n    const next = FRACTIONS.find(t => seats < t.need);\n    base.selSeats = seats;\n    base.selPct = pct(seats);\n    base.verdict = seats >= meta.simpleMajority ? 'Passes ordinary legislation' : (meta.simpleMajority - seats) + ' short of 51';\n    base.verdictColor = seats >= meta.simpleMajority ? 'var(--pass)' : 'rgba(255,255,255,.72)';\n    base.fillColor = seats >= meta.simpleMajority ? 'var(--pass)' : 'var(--accent)';\n    base.hint = seats === 0 ? 'Pick parties below, or click seats on the floor plan.'\n      : next ? (next.need - seats) + (next.need - seats === 1 ? ' more seat reaches ' : ' more seats reach ') + next.fraction + ' (' + next.need + ').'\n      : 'Clears every constitutional threshold.';\n    base.marks = FRACTIONS.map(t => {\n      const hit = seats >= t.need;\n      return {\n        need: t.need, fraction: t.fraction, left: pct(t.need),\n        tick: hit ? 'rgba(255,255,255,.9)' : 'rgba(255,255,255,.22)',\n        color: hit ? '#fff' : 'rgba(255,255,255,.5)',\n        chipBg: hit ? 'rgba(74,222,128,.16)' : 'rgba(255,255,255,.06)',\n        chipBorder: hit ? 'rgba(74,222,128,.5)' : 'rgba(255,255,255,.14)',\n        chipFg: hit ? 'var(--pass)' : 'rgba(255,255,255,.82)',\n        chipNote: (hit ? '✓ ' : '✕ ') + t.need + ' · ' + t.note\n      };\n    });\n    base.presets = [\n      { label: 'Coalition', color: 'var(--text)', run: () => this.setState({ sel: { parties: Object.keys(m.d.alignment.blocs).filter(k => m.d.alignment.blocs[k] === 'coalition'), added: [], excluded: [] } }) },\n      { label: 'Opposition', color: 'var(--text)', run: () => this.setState({ sel: { parties: Object.keys(m.d.alignment.blocs).filter(k => m.d.alignment.blocs[k] === 'opposition'), added: [], excluded: [] } }) },\n      { label: 'Clear', color: 'var(--muted)', run: () => this.setState({ sel: { parties: [], added: [], excluded: [] } }) }\n    ];\n    base.calcParties = partyIds.map(id => {\n      const p = m.party[id];\n      const count = m.roster.filter(mp => m.vb(mp) === id && inCount.has(mp.uuid)).length;\n      const on = count > 0;\n      return {\n        short: id === 'independent' ? 'Unaligned' : p.short, color: p.color,\n        count, total: m.counts[id], toggle: () => this.togglePartyCalc(m, id),\n        border: on ? p.color : 'var(--line)', bg: on ? 'var(--card)' : 'transparent',\n        countColor: on ? 'var(--text)' : 'var(--muted)'\n      };\n    });\n    const adj = [];\n    this.state.sel.excluded.forEach(u => {\n      const mp = m.byUuid.get(u); if (!mp) return;\n      adj.push({ name: mp.name, note: 'Held out of ' + this.shortOf(m, m.vb(mp)), badge: '−1', badgeBg: 'var(--remBg)', badgeFg: 'var(--remFg)',\n        undo: () => this.setState(s => ({ sel: { ...s.sel, excluded: s.sel.excluded.filter(x => x !== u) } })) });\n    });\n    this.state.sel.added.forEach(u => {\n      const mp = m.byUuid.get(u); if (!mp) return;\n      adj.push({ name: mp.name, note: 'Votes with the group · ' + this.shortOf(m, m.vb(mp)), badge: '+1', badgeBg: 'var(--addBg)', badgeFg: 'var(--addFg)',\n        undo: () => this.setState(s => ({ sel: { ...s.sel, added: s.sel.added.filter(x => x !== u) } })) });\n    });\n    base.adjustments = adj;\n    base.noAdjDisplay = adj.length ? 'none' : 'block';\n    }\n    return base;\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
