<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Riigikogu XV Dashboard</title>
  <meta name="theme-color" content="#0f172a">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f4f6f8;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 400px;
      background-color: #ffffff;
      border-radius: 16px;
      padding: 40px 30px;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    h1 {
      color: #0f172a;
      font-size: 24px;
      margin-bottom: 15px;
    }
    p {
      color: #64748b;
      line-height: 1.6;
    }
    .retry-btn {
      margin-top: 25px;
      padding: 12px 30px;
      background-color: #0f172a;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    .retry-btn:hover {
      background-color: #1e293b;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #080d16;
        color: #f6f8fb;
      }
      .container {
        background-color: #131b29;
      }
      h1 {
        color: #f6f8fb;
      }
      p {
        color: #93a1b8;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>Please check your internet connection and try again.</p>
    <button class="retry-btn" onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
